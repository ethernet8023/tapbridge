# Builds every app on every push to main and every pull request:
#   macOS    tests + clippy, tapbridge.app + IFD bundle -> unsigned .pkg
#   Windows  tests (x64), tapbridge.exe + Inno Setup installer (x64, arm64)
#   Android  unit tests, debug APK with the Rust JNI library (16 KB checked),
#            carrying both Windows installers (Settings -> Install on a PC)
# Artifacts are unsigned dev builds (the macOS app is ad-hoc signed; its
# virtual security key only runs with AMFI off, see spikes/fido-hid).
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Toolchain
        run: |
          xcodebuild -version
          rustc --version
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build release
        run: cargo build --release -p tapbridge-desktop --locked
      - name: Build IFD bundle
        run: crates/desktop/ifd_shim/build.sh
      - name: Build pkg
        run: scripts/build-pkg.sh
      - uses: actions/upload-artifact@v5
        with:
          name: tapbridge-macos
          path: dist/*.pkg
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          components: clippy
          cache-key: ${{ matrix.arch }}
      - name: Use LLVM clang (ring needs it on Windows)
        run: |
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (!(Test-Path "$llvm\clang.exe")) { choco install llvm -y --no-progress }
          "$llvm" | Out-File -FilePath $env:GITHUB_PATH -Append
          "CC=$llvm\clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test
        if: matrix.arch == 'x64'
        run: cargo test --workspace --locked
      - name: Clippy
        if: matrix.arch == 'x64'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build release
        run: cargo build --release -p tapbridge-desktop --locked --target ${{ matrix.target }}
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
              Where-Object { $_.name -eq 'tapbridge-desktop' } | Select-Object -ExpandProperty version
          $out = "dist\tapbridge-$version-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\tapbridge.exe" $out
          $usbip = & scripts\fetch-usbip.ps1 -Arch ${{ matrix.arch }}
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppArch=${{ matrix.arch }}" "/DAppVersion=$version" "/DUsbipFile=$usbip" installer\tapbridge.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
      - uses: actions/upload-artifact@v5
        with:
          name: tapbridge-windows-${{ matrix.arch }}
          path: |
            dist/*-setup.exe
            dist/tapbridge-*-${{ matrix.arch }}/tapbridge.exe
          if-no-files-found: error

  android:
    # Waits for both Windows installers: the APK carries them so the phone
    # can hand the PC app over USB tethering (USB plan, Track I).
    needs: windows
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      # The real Firebase config is gitignored. Use the GOOGLE_SERVICES_JSON
      # secret when set; otherwise a placeholder with the right package name,
      # which builds fine but can't receive push wakes.
      - name: google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set; using a placeholder (no push wake)"
            cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "tapbridge-ci",
              "storage_bucket": "tapbridge-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "computer.ethernet.tapbridge" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyCI-PLACEHOLDER-000000000000000000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi
      - uses: actions/download-artifact@v5
        with:
          name: tapbridge-windows-x64
          path: windows-artifacts/x64
      - uses: actions/download-artifact@v5
        with:
          name: tapbridge-windows-arm64
          path: windows-artifacts/arm64
      - name: Bundle Windows installers
        run: |
          dest=android/app/src/main/assets/installer
          mkdir -p "$dest"
          shopt -s nullglob
          for arch in x64 arm64; do
            files=(windows-artifacts/$arch/*-setup.exe windows-artifacts/$arch/dist/*-setup.exe)
            if [ ${#files[@]} -ne 1 ]; then
              echo "::error::expected one $arch setup.exe, found ${#files[@]}"
              exit 1
            fi
            cp "${files[0]}" "$dest/"
          done
          ls -l "$dest"
      - name: Unit tests + debug APK
        run: scripts/build-android.sh testDebugUnitTest assembleDebug --console=plain
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: tapbridge-android-test-results
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        with:
          name: tapbridge-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

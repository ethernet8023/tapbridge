[package]
name = "tapbridge-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tapbridge-core = { path = "../core" }
tokio.workspace = true
iroh.workspace = true
tempfile = "3"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
# CTAP2 clientPIN proxy (ctap_pin): P-256 ECDH, AES-256-CBC, HMAC/HKDF-SHA-256.
p256 = { version = "0.13", default-features = false, features = ["ecdh", "arithmetic", "std"] }
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
getrandom = "0.2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_System_Memory",
] }

[target.'cfg(target_os = "macos")'.dependencies]
aes-gcm = "0.10"
security-framework = { version = "3", features = ["OSX_10_15"] }
security-framework-sys = "2.17"
core-foundation = "0.10"

[features]
# Exposes the software FIDO2 authenticator (ctap_pin::fake) to other crates' tests.
test-support = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

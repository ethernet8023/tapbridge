[package]
name = "tapbridge-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tapbridge"
path = "src/main.rs"

[features]
# `--preview-ui` saves every window to docs/screenshots/*.png when
# TAPBRIDGE_SCREENSHOTS is set (gpui's offscreen render; no screen access).
screenshots = ["gpui/test-support", "gpui_platform/test-support", "dep:image"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
tapbridge-host = { path = "../host" }
tapbridge-core = { path = "../core" }
tokio.workspace = true
gpui = { package = "gpui-ce", version = "=0.2.2", default-features = false }
gpui_platform = { package = "gpui_ce_platform", version = "=0.1.0", features = ["font-kit", "macos-wgpu"] }
gpui-glass = { path = "../../third_party/gpui-glass/crates/gpui-glass" }
gpui-smooth = { path = "../../third_party/gpui-glass/crates/gpui-smooth", features = ["gpui"] }
tray-icon = "0.26"
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
png = "0.18"
unicode-segmentation = "1"
# USB link to a phone (Android Open Accessory); pure Rust, macOS + Windows.
nusb = { path = "../../third_party/nusb" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_EventLog",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
iroh.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# tray-icon's menu is GTK: it must be initialized and its events pumped (tray.rs).
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }
system-configuration-sys = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
core-foundation = "0.10"

[dev-dependencies]
tapbridge-host = { path = "../host", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"

[build-dependencies]
winresource = "0.1"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- tapbridge master icon. Background and glyph are separate groups so
       platform pipelines can take the glyph alone (Android adaptive
       foreground, monochrome themed icon, Windows tray). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#2B1A80"/>
    </linearGradient>
  </defs>
  <g id="background">
    <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  </g>
  <g id="glyph" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="64">
    <!-- the card -->
    <rect x="262" y="362" width="300" height="400" rx="56" transform="rotate(-14 412 562)"/>
    <!-- NFC waves bridging out of the card -->
    <path d="M610 400 a150 150 0 0 1 0 212"/>
    <path d="M690 330 a250 250 0 0 1 0 352"/>
    <path d="M770 260 a350 350 0 0 1 0 492" opacity="0.55"/>
  </g>
</svg>
